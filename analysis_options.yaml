# Static analysis for the EMC Helpline app.
# Run locally with `flutter analyze`; CI runs the same command.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Reaching for a BuildContext after an await is how "widget disposed"
    # crashes get shipped; treat it as a build failure, not a hint.
    use_build_context_synchronously: error
  exclude:
    # Regenerated by `flutter pub get` from lib/l10n/*.arb.
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_empty_else
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally
    - unawaited_futures

    # Readability, and cheap performance wins in a widget tree
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - avoid_redundant_argument_values
    - unnecessary_parenthesis

    # This app ships user-facing copy in ARB files; a stray print is noise.
    - avoid_print
