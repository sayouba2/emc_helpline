<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- La console refuse de charger sans claim agent, mais un lien égaré n'a
     rien à faire dans un index. -->
<meta name="robots" content="noindex, nofollow">
<title>Console — EMC Helpline</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <h1 class="wordmark">EMC Helpline <span>Console</span></h1>
  <div class="session" id="session"></div>
</header>

<section class="signin" id="signin">
  <h2>Connexion</h2>
  <p>Réservé à l'équipe. Chaque dossier ouvert est enregistré avec votre adresse.</p>
  <form id="signin-form">
    <label>Adresse e-mail
      <input type="email" id="email" required autocomplete="username" autofocus>
    </label>
    <label>Mot de passe
      <input type="password" id="password" required autocomplete="current-password">
    </label>
    <button type="submit" id="signin-button">Se connecter</button>
  </form>
  <div id="signin-notice" hidden></div>
</section>

<main class="console" id="console" hidden>

  <section class="queue" aria-label="File des dossiers">
    <div class="queue-head">
      <h2>File</h2>

      <!-- Quelqu'un appelle et lit son numéro : c'est le seul moyen d'ouvrir
           son dossier, puisque le code est stocké haché. -->
      <form class="lookup" id="lookup-form">
        <input
          id="lookup-code"
          class="mono"
          placeholder="EMC-4K7P-W9XM-2QTR"
          aria-label="Ouvrir un dossier par son numéro de référence"
          autocomplete="off"
          spellcheck="false">
        <button type="submit" class="quiet">Ouvrir</button>
      </form>

      <div class="filters" id="filters" role="group" aria-label="Filtrer par statut"></div>
    </div>

    <div id="queue-notice"></div>
    <ol class="ledger" id="ledger" role="listbox" aria-label="Dossiers" tabindex="0"></ol>
    <div class="queue-foot">
      <button id="more" class="quiet" hidden>Charger la suite</button>
    </div>
  </section>

  <section class="file" id="file" aria-live="polite"></section>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
